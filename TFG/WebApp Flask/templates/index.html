<!DOCTYPE html>
<html>
<head>
    <title>Transmisor o Receptor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1, h2 {
            margin: 20px;
        }

        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 20px;
            border-radius: 10px;
            border: none;
            background-color: #007bff;
            color: white;
        }

        #images img {
            width: 40%;
            max-width: 200px;
            margin: 10px;
            cursor: pointer;
            border-radius: 15px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        }

        #receiver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #receiver img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @media (orientation: landscape) {
            #receiver img {
                object-fit: cover;
            }
        }

        #images {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            max-height: 80vh;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>Selecciona tu rol:</h1>
    <button onclick="chooseRole('transmitter')">Soy Transmisor</button>
    <button onclick="chooseRole('receiver')">Soy Receptor</button>

    <div id="status"></div>

    <div id="images" style="display:none;">
        <h2>Selecciona una imagen:</h2>

        <img src="/fotos/Verde1.jpg" onclick="sendImage('Verde1.jpg')">
        <img src="/fotos/Naranja1.jpg" onclick="sendImage('Naranja1.jpg')">
        <img src="/fotos/Azul1.jpg" onclick="sendImage('Azul1.jpg')">
        <img src="/fotos/Lila1.jpg" onclick="sendImage('Lila1.jpg')">

        <img src="/fotos/Perro1.jpg" onclick="sendImage('Perro1.jpg')">
        <img src="/fotos/Gato1.jpg" onclick="sendImage('Gato1.jpg')">
        <img src="/fotos/Pajaro1.jpg" onclick="sendImage('Pajaro1.jpg')">
        <img src="/fotos/Caballo1.jpg" onclick="sendImage('Caballo1.jpg')">

        <img src="/fotos/OtroPerro.jpg" onclick="sendImage('OtroPerro.jpg')">
        <img src="/fotos/OtroGato.jpg" onclick="sendImage('OtroGato.jpg')">
        <img src="/fotos/OtroPajaro.jpg" onclick="sendImage('OtroPajaro.jpg')">
        <img src="/fotos/OtroCaballo.jpg" onclick="sendImage('OtroCaballo.jpg')">

        <img src="/fotos/Perro2.jpg" onclick="sendImage('Perro2.jpg')">
        <img src="/fotos/Gato2.jpg" onclick="sendImage('Gato2.jpg')">
        <img src="/fotos/Pajaro2.jpg" onclick="sendImage('Pajaro2.jpg')">
        <img src="/fotos/Caballo2.jpg" onclick="sendImage('Caballo2.jpg')">

        <img src="/fotos/Perro3.jpg" onclick="sendImage('Perro3.jpg')">
        <img src="/fotos/Gato3.jpg" onclick="sendImage('Gato3.jpg')">
        <img src="/fotos/Pajaro3.jpg" onclick="sendImage('Pajaro3.jpg')">
        <img src="/fotos/Caballo3.jpg" onclick="sendImage('Caballo3.jpg')">

        <img src="/fotos/Perro4.jpg" onclick="sendImage('Perro4.jpg')">
        <img src="/fotos/Gato4.jpg" onclick="sendImage('Gato4.jpg')">
        <img src="/fotos/Pajaro4.jpg" onclick="sendImage('Pajaro4.jpg')">
        <img src="/fotos/Caballo4.jpg" onclick="sendImage('Caballo4.jpg')">

        <img src="/fotos/Perro5.jpg" onclick="sendImage('Perro5.jpg')">
        <img src="/fotos/Gato5.jpg" onclick="sendImage('Gato5.jpg')">
        <img src="/fotos/Pajaro5.jpg" onclick="sendImage('Pajaro5.jpg')">
        <img src="/fotos/Caballo5.jpg" onclick="sendImage('Caballo5.jpg')">
        <img src="/fotos/Caballo6.jpg" onclick="sendImage('Caballo6.jpg')">
        <img src="/fotos/Caballo7.jpg" onclick="sendImage('Caballo7.jpg')">
        <img src="/fotos/Caballo8.jpg" onclick="sendImage('Caballo8.jpg')">
        <img src="/fotos/Caballo9.jpg" onclick="sendImage('Caballo9.jpg')">
        <img src="/fotos/Caballo10.jpg" onclick="sendImage('Caballo10.jpg')">


    </div>

    <div id="receiver"></div>

    <script>
        var socket = io();
        var role = "";

        function chooseRole(r) {
            role = r;
            socket.emit('choose_role', {role: r});
        }

        function sendImage(img) {
            socket.emit('send_image', {image: img});
        }

        socket.on('waiting', data => {
            document.getElementById("status").innerHTML = data.msg;
        });

        socket.on('ready', data => {
            document.getElementById("status").innerHTML = data.msg;
            if (role === "transmitter") {
                document.getElementById("images").style.display = "block";
            }
        });

        socket.on('show_image', data => {
            const receiver = document.getElementById("receiver");
            let imgPath = "/fotos/" + data.image;
            receiver.innerHTML = `<img src="${imgPath}">`;
            receiver.style.display = "flex";
            openFullScreen(receiver);
        });

        function openFullScreen(elem) {
            if (elem.requestFullscreen) elem.requestFullscreen();
            else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
        }
    </script>

</body>
</html>
