<!DOCTYPE html>
<html>
<head>
    <title>Transmisor o Receptor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1, h2 {
            margin: 20px;
        }

        button {
            font-size: 1.5em;
            padding: 15px 30px;
            margin: 20px;
            border-radius: 10px;
            border: none;
            background-color: #007bff;
            color: white;
        }

        #images img {
            width: 40%;
            max-width: 200px;
            margin: 10px;
            cursor: pointer;
            border-radius: 15px;
            box-shadow: 0px 4px 6px rgba(0,0,0,0.2);
        }

        /* Receptor pantalla completa */
        #receiver {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: none; /* oculto por defecto */
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Imagen a pantalla completa, adaptada perfectamente */
        #receiver img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* mantiene proporciones sin recortar */
        }

        /* Si el móvil está en horizontal, usa cover para llenar */
        @media (orientation: landscape) {
            #receiver img {
                object-fit: cover;
            }
        }
    </style>
</head>
<body>
    <h1>Selecciona tu rol:</h1>
    <button onclick="chooseRole('transmitter')">Soy Transmisor</button>
    <button onclick="chooseRole('receiver')">Soy Receptor</button>

    <div id="status"></div>

    <div id="images" style="display:none;">
        <h2>Selecciona una imagen:</h2>
        <img src="https://2.bp.blogspot.com/-fOKnfX3wl_4/WfEkY9coU3I/AAAAAAAAA6Q/O1huB_NomcgBt9XdMnJ3nj_lgv7_5ja7ACLcBGAs/s1600/color+rojo.jpg" onclick="sendImage('rojo')">
        <img src="https://cdn.shopify.com/s/files/1/1088/9628/products/Verde_be86844b-a2bb-48cd-bfe2-4e8a6c613132_grande.jpg" onclick="sendImage('verde')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/3/32/House_sparrow04.jpg" onclick="sendImage('pajaro')">
        <img src="https://thypix.com/wp-content/uploads/horse-113.jpg" onclick="sendImage('caballo')">
    </div>

    <div id="receiver"></div>

    <script>
        var socket = io();
        var role = "";

        function chooseRole(r) {
            role = r;
            socket.emit('choose_role', {role: r});
        }

        function sendImage(img) {
            socket.emit('send_image', {image: img});
        }

        socket.on('waiting', function(data) {
            document.getElementById("status").innerHTML = data.msg;
        });

        socket.on('ready', function(data) {
            document.getElementById("status").innerHTML = data.msg;
            if (role === "transmitter") {
                document.getElementById("images").style.display = "block";
            }
        });

        socket.on('show_image', function(data) {
            const receiver = document.getElementById("receiver");
            let html = "";
            if (data.image === "rojo") {
                html = '<img src="https://2.bp.blogspot.com/-fOKnfX3wl_4/WfEkY9coU3I/AAAAAAAAA6Q/O1huB_NomcgBt9XdMnJ3nj_lgv7_5ja7ACLcBGAs/s1600/color+rojo.jpg">';
            } else if (data.image === "verde") {
                html = '<img src="https://cdn.shopify.com/s/files/1/1088/9628/products/Verde_be86844b-a2bb-48cd-bfe2-4e8a6c613132_grande.jpg">';
            } else if (data.image === "pajaro") {
                html = '<img src="https://upload.wikimedia.org/wikipedia/commons/3/32/House_sparrow04.jpg">';
            } else if (data.image === "caballo") {
                html = '<img src="https://thypix.com/wp-content/uploads/horse-113.jpg">';
            }

            receiver.innerHTML = html;
            receiver.style.display = "flex"; // mostrar solo cuando haya imagen

            // Forzar modo pantalla completa si el receptor está en móvil
            openFullScreen(receiver);
        });

        // Limpieza (opcional)
        socket.on('clear_image', function() {
            const receiver = document.getElementById("receiver");
            receiver.innerHTML = "";
            receiver.style.display = "none";
        });

        // Función para entrar en pantalla completa en móvil
        function openFullScreen(elem) {
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }
    </script>
</body>
</html>
